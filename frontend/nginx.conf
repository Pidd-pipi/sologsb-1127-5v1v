server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript
               application/json application/xml application/xml+rss image/svg+xml
               font/ttf font/otf font/woff font/woff2;

    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
    location = /index.html { add_header Cache-Control "no-cache, no-store, must-revalidate"; expires -1; }

    # 离线核验交接 API → server 服务（Docker 内网 DNS 运行时解析，避免启动顺序问题）
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $handover_upstream http://server:4021;
        proxy_pass $handover_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    location / { try_files $uri $uri/ /index.html; }
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
}
