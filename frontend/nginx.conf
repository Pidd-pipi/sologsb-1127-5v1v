server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript
               application/json application/xml application/xml+rss image/svg+xml
               font/ttf font/otf font/woff font/woff2;

    # 同步服务（区域领取仲裁 + 字段级合并 + 冲突裁决）
    location /api/ {
        proxy_pass http://hub:21828;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 3s;
        proxy_read_timeout 20s;
        # hub 短暂不可用时前端自动转「断网本机保存」，不缓存错误响应
        proxy_intercept_errors off;
    }

    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
    location = /index.html { add_header Cache-Control "no-cache, no-store, must-revalidate"; expires -1; }
    location / { try_files $uri $uri/ /index.html; }
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
}
